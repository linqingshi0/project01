version: '3.9'
services:
  mongo:
    image: mongo:6
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env
    environment:
      - MONGO_URL=mongodb://mongo:27017/lighteats
    depends_on:
      - mongo
    ports:
      - "4000:4000"
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      - VITE_API_BASE_URL=http://localhost:4000
    depends_on:
      - api
    ports:
      - "5173:80"
volumes:
  mongo_data:
